# .pre-commit-config.yaml
# Runs on every `git commit` after `pre-commit install`
# (Chapter 17). Run on all files: pre-commit run -a
# Chapter 20's configs are broken on purpose, so skip them.
exclude: ^chapters/ch20/

repos:
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.109.1
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
      - id: terraform_tflint
        args:
          - --args=--config=__GIT_WORKING_DIR__/.tflint.hcl
      - id: terraform_checkov
        args:
          - --args=--quiet
          - --args=--compact
          - --args=--framework terraform
          # Report only, until existing findings are triaged.
          - --args=--soft-fail

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
